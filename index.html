<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>P2P Adressbuch</title>
    <meta
      name="description"
      content="Adressbuch ohne zentralen Server: Jeder pflegt seine eigene Karte und gibt gezielt frei, was andere sehen."
    />
    <meta name="theme-color" content="#f1efe9" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Adressbuch" />
    <!-- Von simple-peer benötigte Node.js-Globale -->
    <script type="module">
      import { Buffer } from 'buffer';
      window.Buffer = Buffer;
      window.global = window;
      window.process = window.process || {
        env: {},
        browser: true,
        version: 'v18.0.0',
        nextTick: function (fn, ...args) {
          setTimeout(() => fn(...args), 0);
        },
      };
    </script>
  </head>
  <body>
    <noscript>Das Adressbuch braucht JavaScript. Bitte aktiviere es in deinem Browser.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
