<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dezentrales Adressbuch mit P2P Messaging">
    <meta name="theme-color" content="#2196F3">
    <title>Dezentrales Adressbuch</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
    <!-- Modern SVG favicon for browsers that support it -->
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <!-- Fallback PNG favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <h1>📒 Adressbuch</h1>
            <button id="installBtn" class="install-btn" style="display: none;">App installieren</button>
        </header>

        <!-- Navigation Tabs -->
        <nav class="tabs">
            <button class="tab-btn active" data-tab="contacts">Kontakte</button>
            <button class="tab-btn" data-tab="messages">Nachrichten</button>
        </nav>

        <!-- Contacts Tab -->
        <div id="contacts-tab" class="tab-content active">
            <!-- Add Contact Form -->
            <div class="card">
                <h2>Neuer Kontakt</h2>
                <form id="contactForm">
                    <input type="text" id="contactName" placeholder="Name" required>
                    <input type="email" id="contactEmail" placeholder="E-Mail" required>
                    <input type="tel" id="contactPhone" placeholder="Telefon">
                    <input type="text" id="contactAddress" placeholder="Adresse">
                    <button type="submit" class="btn-primary">Kontakt hinzufügen</button>
                </form>
            </div>

            <!-- Contacts List -->
            <div class="card">
                <h2>Meine Kontakte</h2>
                <div id="contactsList" class="contacts-list"></div>
            </div>
        </div>

        <!-- Messages Tab -->
        <div id="messages-tab" class="tab-content">
            <!-- Message Composer -->
            <div class="card">
                <h2>Neue Nachricht</h2>
                <form id="messageForm">
                    <select id="messageRecipient" required>
                        <option value="">Empfänger wählen...</option>
                    </select>
                    <div class="message-input-wrapper">
                        <textarea
                            id="messageText"
                            placeholder="Nachricht eingeben (max. 210 Zeichen)"
                            maxlength="210"
                            rows="3"
                            required
                        ></textarea>
                        <span class="char-counter"><span id="charCount">0</span>/210</span>
                    </div>
                    <button type="submit" class="btn-primary">Senden</button>
                </form>
            </div>

            <!-- Messages List -->
            <div class="card">
                <h2>Nachrichten</h2>
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">Alle</button>
                    <button class="filter-btn" data-filter="sent">Gesendet</button>
                    <button class="filter-btn" data-filter="received">Empfangen</button>
                </div>
                <div id="messagesList" class="messages-list"></div>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="statusBar" class="status-bar"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
